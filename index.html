<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول | مؤسسة جزّاري</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2c3e50; /* لون خلفية داكن يعطي طابعاً احترافياً */
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; /* لجعل المحتوى في منتصف الشاشة تماماً */
        }
        .portal-container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center; 
            max-width: 450px; 
            width: 90%; 
        }
        .portal-container h1 { 
            color: #d9534f; 
            margin-top: 0;
            margin-bottom: 10px; 
            font-size: 32px;
        }
        .portal-container p { 
            color: #7f8c8d; 
            margin-bottom: 35px; 
            font-size: 16px;
            line-height: 1.5;
        }
        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .btn-portal { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            text-decoration: none; 
            padding: 15px 20px; 
            border-radius: 10px; 
            font-size: 20px; 
            font-weight: bold; 
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-admin { 
            background-color: #2980b9; 
            color: white; 
        }
        .btn-branch { 
            background-color: #27ae60; 
            color: white; 
        }
        .btn-portal:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 6px 15px rgba(0,0,0,0.15); 
        }
        .icon { 
            font-size: 28px; 
        }
    </style>
</head>
<body>

<div class="portal-container">
    <h1>🥩 مؤسسة جزّاري</h1>
    <p>مرحباً بك في النظام الآلي لإدارة الفروع. يرجى اختيار مسار الدخول الخاص بك:</p>
    
    <div class="options">
        <!-- زر المشرف العام يوجه إلى ملف dashboard.html -->
        <a href="dashboard.html" class="btn-portal btn-admin">
            <span class="icon">👑</span>
            دخول المشرف العام
        </a>
        
        <!-- زر مشرف الفرع يوجه إلى ملف branch.html -->
        <a href="branch.html" class="btn-portal btn-branch">
            <span class="icon">🔪</span>
            دخول مشرف الجزارة
        </a>
    </div>
</div>

</body>
</html>
